name: macos

# Kept out of ci.yml: hosted macOS runners are sometimes unavailable, and a
# job GitHub cannot schedule would mark every commit red. This runs weekly,
# on release tags, and by hand (Actions → macos → Run workflow).
on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet + race tests (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race -count=1 ./...
